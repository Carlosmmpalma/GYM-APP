name: gym_saas
description: >
  Gym SaaS — plataforma multi-tenant para ginásios.
  Ver Technical/Platform Foundation — Gym SaaS.md para a arquitetura de referência.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado / DI (Platform Foundation §5, §10)
  flutter_riverpod: ^2.5.1

  # Firebase — infraestrutura de referência (Platform Foundation §5)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  cloud_functions: ^5.0.1
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.1
  firebase_app_check: ^0.3.1
  firebase_crashlytics: ^4.0.1

  # Utilitários
  intl: ^0.19.0
  equatable: ^2.0.5

  # Fase 8 — vídeo demonstrativo de exercícios (UC15): `file_picker`
  # devolve bytes (não `dart:io File`), único jeito de funcionar sem
  # ramificação por plataforma em Flutter Web; `video_player` é o
  # pacote oficial do Flutter, suporta Web/mobile sem plugin extra.
  file_picker: ^8.1.2
  video_player: ^2.9.2
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3
  fake_cloud_firestore: ^3.0.3
  firebase_auth_mocks: ^0.14.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

# Ícone da app (Fase 10). `app_icon.png` é o quadrado 1024x1024 do
# estúdio; regerar com `dart run flutter_launcher_icons` sempre que o
# ficheiro mudar. `adaptive_icon_background` é o preto do tema
# (`AppColors.void_`) e não branco: no Android o ícone adaptativo é
# recortado em círculo/squircle, e um fundo branco daria um anel claro à
# volta de um logo desenhado para fundo escuro.
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#0B0B0C"
    theme_color: "#E11D2E"
  windows:
    generate: true
  adaptive_icon_background: "#0B0B0C"
  adaptive_icon_foreground: assets/branding/app_icon.png
