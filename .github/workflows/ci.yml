name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Verificar formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisar (lint)
        run: flutter analyze --fatal-infos

      - name: Testes unitários
        run: flutter test --coverage

      # Testes de integração contra o Firebase Emulator Suite (Fase 1+:
      # isolamento entre tenants, concorrência na última vaga) entram aqui
      # quando existirem, correndo antes num job separado com
      # firebase emulators:exec.

  functions:
    name: Cloud Functions lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test --if-present
