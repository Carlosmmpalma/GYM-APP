name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Verificar formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisar (lint)
        run: flutter analyze --fatal-infos

      - name: Testes unitários
        run: flutter test --coverage

      # integration_test/ (contra o emulador a sério) não corre aqui —
      # precisa de um device/simulador, não só do SDK. Ver README.md.

  rules-isolation:
    name: 🔴 Isolamento entre tenants (Security Rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Instalar dependências dos testes de rules
        working-directory: firebase/tests
        run: npm ci || npm install

      - name: Correr testes de isolamento contra o emulador do Firestore
        run: |
          firebase emulators:exec --project=demo-gym-saas-dev --only firestore \
            "npm --prefix firebase/tests test"

  functions:
    name: Cloud Functions lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test --if-present
