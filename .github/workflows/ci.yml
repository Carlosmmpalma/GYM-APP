name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Verificar formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisar (lint)
        run: flutter analyze --fatal-infos

      - name: Testes unitários
        run: flutter test --coverage

      # A build que vai para o ar é a de PRODUÇÃO — `lib/main.dart`
      # aponta para development, e publicar esse artefacto dava uma app
      # com aspeto normal a escrever na base de dados errada. Compilar
      # aqui garante que o caminho de produção não parte sem ninguém
      # dar por isso até ao dia do deploy.
      - name: Build de produção (web)
        run: flutter build web --release -t lib/main_production.dart

      # integration_test/ (contra o emulador a sério) não corre aqui —
      # precisa de um device/simulador, não só do SDK. Ver README.md.

  rules-isolation:
    name: 🔴 Security Rules (isolamento + concorrência de bookings + plans/subscriptions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Instalar dependências dos testes de rules
        working-directory: firebase/tests
        run: npm ci || npm install

      - name: Instalar dependências das Cloud Functions
        working-directory: firebase/functions
        run: npm ci || npm install

      # O emulador serve o JavaScript de `functions/lib`, não o
      # TypeScript. Sem compilar antes, arranca sem funções nenhumas e
      # metade da suite falha com `not-found`.
      - name: Build das Cloud Functions
        working-directory: firebase/functions
        run: npm run build

      # Corre TODOS os *.test.ts em firebase/tests (vitest apanha-os
      # automaticamente).
      #
      # Fase 11 — isto corria com `--only firestore`, o que deixava de
      # fora os cinco ficheiros que chamam Cloud Functions a sério:
      # concorrência na última vaga, sessões extra, grupos exclusivos,
      # RGPD e poderes do Gestor. Precisam de `functions` (a função em
      # si), `auth` (tokens com custom claims) e `storage` (rules de
      # vídeos). Ou seja: os testes de MAIOR valor da suite não estavam
      # a ser corridos em CI nenhuma.
      - name: Correr a suite completa contra o Emulator Suite
        run: |
          firebase emulators:exec --project=demo-gym-saas-dev \
            --only firestore,functions,auth,storage \
            "npm --prefix firebase/tests test"

  functions:
    name: Cloud Functions lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test --if-present
